name: CD - Deploy Model to Azure ML

on:
  workflow_dispatch:
    inputs:
      endpoint_name:
        description: "Globally unique Azure ML Endpoint name"
        required: true
        default: "fraud-live-fahd40"
  push:
    branches:
      - master
    paths:
      - "artifacts/fraud_model.joblib"
      - "artifacts/score.py"
      - "artifacts/conda.yaml"
      - "infra/azureml/**"
      - "scripts/deploy_azureml.py"

jobs:
  deploy-azureml:
    name: Register & Deploy to Azure ML Endpoint
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AZUREML_CD == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure ML SDK v2 & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity joblib lightgbm scikit-learn numpy

      - name: Azure Login via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Train Model if Artifact Missing
        run: |
          if [ ! -f artifacts/fraud_model.joblib ]; then
            pip install -e .
            python -m fraud_detection.ml.train
          fi

      - name: Deploy Model & Endpoint to Azure ML
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_WORKSPACE_NAME: ${{ secrets.AZURE_WORKSPACE_NAME }}
          AZUREML_ENDPOINT_NAME: ${{ github.event.inputs.endpoint_name || 'fraud-live-fahd40' }}
        run: |
          python scripts/deploy_azureml.py

