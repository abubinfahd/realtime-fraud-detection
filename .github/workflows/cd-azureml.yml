name: CD - Azure ML Cloud MLOps Pipeline

on:
  workflow_dispatch:
    inputs:
      unique_suffix:
        description: "Unique resource name suffix (e.g. fahd40)"
        required: true
        default: "fahd40"
      skip_train:
        description: "Skip cloud training job (only register & deploy)"
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - "src/fraud_detection/**"
      - "artifacts/score.py"
      - "artifacts/conda.yaml"
      - "infra/azureml/**"
      - "scripts/run_azureml_pipeline.py"
      - "scripts/deploy_azureml.py"

jobs:
  ci-test-and-cloud-deploy:
    name: CI Test ➔ Azure ML Cloud Train ➔ Register ➔ Deploy
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AZUREML_CD == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Run CI Tests
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
          pytest tests/unit/ -v

      - name: Install Azure ML SDK v2
        run: |
          pip install azure-ai-ml azure-identity joblib lightgbm scikit-learn numpy

      - name: Azure Login via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Execute Full End-to-End Azure ML Pipeline
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_WORKSPACE_NAME: ${{ secrets.AZURE_WORKSPACE_NAME }}
          AZUREML_UNIQUE_SUFFIX: ${{ github.event.inputs.unique_suffix || vars.AZUREML_UNIQUE_SUFFIX || 'fahd40' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.skip_train }}" = "true" ]; then
            FLAGS="--skip-train"
          fi
          python scripts/run_azureml_pipeline.py $FLAGS
