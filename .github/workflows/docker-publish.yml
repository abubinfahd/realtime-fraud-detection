name: Docker Build, Scan & Publish

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
    paths:
      - "src/**"
      - "scripts/**"
      - "dashboard/**"
      - "Dockerfile.*"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-and-publish:
    name: Build & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: producer
            dockerfile: Dockerfile.producer
          - service: consumer
            dockerfile: Dockerfile.consumer
          - service: api
            dockerfile: Dockerfile.api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure baseline ML model artifact exists for container build
        if: matrix.service != 'producer'
        run: |
          if [ ! -f "artifacts/fraud_model.joblib" ]; then
            pip install uv
            uv sync --no-dev
            uv run python src/fraud_detection/ml/train.py
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/fraud-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local image for Trivy vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: fraud-${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fraud-${{ matrix.service }}:scan
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push verified image to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

