# Pre-commit configuration for Real-Time Fraud Detection System
# See https://pre-commit.com for more information
# Run manually via: uv run pre-commit run --all-files

default_language_version:
  python: python3.12

repos:
  # 1. Standard file hygiene & sanity checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^data/.*'
      - id: end-of-file-fixer
        exclude: '^data/.*'
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
        exclude: '^data/raw/.*\.csv$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements

  # 2. Ruff: Blazing fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # 3. Security: Prevent committing plain-text secrets and private keys
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
