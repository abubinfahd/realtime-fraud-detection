[project]
name = "fraud-detection"
version = "0.1.0"
description = "Production-grade, event-driven streaming system for real-time financial fraud detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "confluent-kafka>=2.4.0",
    "faker>=25.0.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
fraud-train = "fraud_detection.ml.train:main"
fraud-infer = "fraud_detection.ml.inference:main"
fraud-producer = "fraud_detection.streaming.producer:main"
fraud-consumer = "fraud_detection.streaming.consumer:main"
fraud-redis-benchmark = "fraud_detection.storage.benchmark:main"
fraud-listen-alerts = "fraud_detection.streaming.listener:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"producers/*" = ["E402"]
"consumers/*" = ["E402"]
"rules/*" = ["E402"]
"models/*" = ["E402"]
"schemas/*" = ["E402"]
"storage/*" = ["E402"]
"benchmarks/*" = ["E402"]



[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
